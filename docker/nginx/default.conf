upstream django_app {
    server app:8000;
}

server {
    listen 80;
    server_name eodiganam.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name eodiganam.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/eodiganam.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eodiganam.duckdns.org/privkey.pem;

    location /static/ {
        alias /static/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}