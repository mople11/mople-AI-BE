[project]
name = "eodiganam"
version = "0.1.0"
description = "Eodiganam Django REST Framework backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "django-environ>=0.12.0",
    "djangorestframework>=3.16.0",
    "djangorestframework-simplejwt>=5.5.0",
    "drf-spectacular>=0.28.0,<1.0",
    "google-auth>=2.56.2",
    "gunicorn>=26.0.0",
    "pymysql>=1.1.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-django>=4.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
